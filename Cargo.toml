[package]
name = "mal_api_rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "mal_api_rs" # The name used when importing: `use mal_api_rs::...`
path = "src/lib.rs" # Tells Cargo exactly where the root library file is

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
compact_str = "0.9.1"
dotenv = "0.15.0"
ordered-float = { version = "5.3.0", features = ["serde"] }
reqwest = { version = "0.13.3", default-features = false, features = [
    "json",
    "rustls",
    "charset",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
strsim = "0.11.1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
url = "2.5.8"
